[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volviewer"
version = "0.1.0"
description = "Local web workspace for Volatility 3 memory-image analysis"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "volatility3==2.28.0",
]

[tool.setuptools]
py-modules = ["server", "volatility_runner"]